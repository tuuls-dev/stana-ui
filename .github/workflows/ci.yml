name: Stana
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"
      - name: Verify required toolchain
        run: swift --version | grep 'Swift version 6.4'
      - name: Swift formatting
        run: Scripts/format-swift.sh lint
      - name: Boundary checks
        run: Scripts/check-boundaries.sh
      - name: Tests and strict concurrency
        run: swift test -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Public consumer API
        run: Scripts/check-api-fixtures.sh
      - name: Runtime fault isolation
        run: Scripts/check-runtime-faults.sh
      - name: External consumer examples
        run: |
          swift build --package-path Examples/Counter -Xswiftc -warnings-as-errors
          swift build --package-path Examples/Preferences -Xswiftc -warnings-as-errors
          swift build --package-path Examples/EditableCollection -Xswiftc -warnings-as-errors
          swift build --package-path Examples/TextFields -Xswiftc -warnings-as-errors
      - name: Release build
        run: swift build -c release -Xswiftc -warnings-as-errors

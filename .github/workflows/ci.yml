name: Stana
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"
      - name: Verify required toolchain
        run: swift --version | grep 'Swift version 6.4'
      - name: Install just
        run: brew install just
      - name: Formatting
        run: just check-format
      - name: Tests and strict concurrency
        run: swift test -Xswiftc -warnings-as-errors
      - name: Public consumer API
        run: Scripts/check-api-fixtures.sh
      - name: Runtime fault isolation
        run: Scripts/check-runtime-faults.sh
      - name: External consumer examples
        run: just build-examples
      - name: Release build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Benchmark harness and workload correctness (no performance timings)
        run: just benchmark-test
